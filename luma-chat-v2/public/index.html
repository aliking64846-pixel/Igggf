<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f6fb"><title>Luma Chat V2</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--soft:#f0f3f9;--text:#20283a;--muted:#8994a8;--line:#e6ebf3;--accent:#7182f6;--bubble:#edf0ff}
[data-theme=dark]{--bg:#101521;--panel:#171f2e;--soft:#202a3b;--text:#edf1fa;--muted:#9aa7bd;--line:#293448;--accent:#929cff;--bubble:#29334d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0}.hide{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#aab5ff38,transparent 35%),var(--bg)}.card{width:min(410px,100%);padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:25px;box-shadow:0 20px 60px #25365b15}.brand{font-size:24px;font-weight:800;display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#7182f6,#a48ae9);display:grid;place-items:center;color:white}.muted{color:var(--muted);line-height:1.7;font-size:13px}.field{width:100%;padding:13px;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:12px;margin:7px 0 13px;outline:none}.primary{padding:12px 17px;border-radius:12px;background:linear-gradient(120deg,#7182f6,#a48ae9);color:#fff;font-weight:700}.wide{width:100%}.link{background:none;color:var(--accent)}.app{height:100dvh;padding:16px;display:grid;grid-template-columns:320px 1fr;gap:14px}.side,.chat{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:0}.side{display:flex;flex-direction:column}.head{padding:18px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.search{margin-top:14px}.tabs{display:flex;padding:9px;gap:5px;border-bottom:1px solid var(--line)}.tab{flex:1;background:none;color:var(--muted);padding:9px 2px;border-radius:10px;font-size:12px}.tab.active{background:var(--bubble);color:var(--accent)}.list{overflow:auto;flex:1;padding:8px}.person{display:flex;align-items:center;gap:10px;padding:11px;border-radius:13px;cursor:pointer}.person:hover{background:var(--soft)}.avatar{width:42px;height:42px;border-radius:15px;background:#cbd2ff;display:grid;place-items:center;color:#384477;font-weight:800}.pinfo{flex:1;min-width:0}.pname{font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:4px}.chat{display:flex;flex-direction:column}.placeholder{margin:auto;text-align:center;color:var(--muted)}.chathead{padding:14px 18px;border-bottom:1px solid var(--line)}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:9px}.msg{max-width:75%;padding:11px 14px;border-radius:16px;background:var(--soft);align-self:flex-start;overflow-wrap:anywhere;line-height:1.6}.msg.mine{align-self:flex-end;background:var(--bubble)}.msg img,.msg video{max-width:100%;max-height:260px;border-radius:12px}.stamp{font-size:10px;color:var(--muted);margin-top:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer .field{margin:0;flex:1;min-width:0}.round{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--text)}.send{background:var(--accent);color:white}.note{padding:7px;text-align:center;background:var(--soft);font-size:11px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:25px 12px;font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222b3d;color:white;padding:11px 16px;border-radius:12px;z-index:4}
@media(max-width:720px){.app{display:block;padding:0;height:100dvh}.side,.chat{height:100dvh;border:0;border-radius:0}.chat{display:none}.app.open .side{display:none}.app.open .chat{display:flex}.back{display:block!important}}
.back{display:none}
</style></head><body>
<section id="auth" class="auth"><div class="card"><div class="brand"><span class="mark">✦</span>Luma Chat <small class="muted">V2</small></div><h2 id="authTitle">أهلاً بيك</h2><p class="muted">مراسلة بسيطة وخاصة، بدون مكالمات صوتية أو فيديو.</p><form id="authForm"><label class="muted">اسم المستخدم</label><input id="username" class="field" required minlength="3" maxlength="20" autocomplete="username"><label class="muted">كلمة المرور</label><input id="password" class="field" type="password" required minlength="8" autocomplete="current-password"><button id="authBtn" class="primary wide">تسجيل الدخول</button></form><p class="muted" id="authError"></p><p class="muted"><span id="switchLabel">ما عندك حساب؟</span> <button class="link" id="switch">إنشاء حساب</button></p></div></section>
<div id="app" class="app hide"><aside class="side"><div class="head"><div class="row between"><div class="brand"><span class="mark">✦</span>Luma Chat</div><button id="theme" class="round">☾</button></div><input id="search" class="field search" placeholder="ابحث عن مستخدم..."></div><div class="tabs"><button class="tab active" data-tab="friends">الأصدقاء</button><button class="tab" data-tab="requests">الطلبات</button><button class="tab" data-tab="search">بحث</button></div><div id="list" class="list"></div><div class="head row"><div class="avatar" id="myAvatar">؟</div><div class="pinfo"><b id="myName"></b><div class="sub">حسابك</div></div><button id="logout" class="round">↪</button></div></aside>
<main class="chat"><div id="placeholder" class="placeholder"><div style="font-size:48px">✦</div><h2>مساحتك الخاصة</h2><p>اختار صديق حتى تبدأ المحادثة</p></div><section id="panel" class="hide" style="height:100%;display:flex;flex-direction:column;min-height:0"><div class="chathead row"><button id="back" class="round back">→</button><div class="avatar" id="peerAvatar">؟</div><div class="pinfo"><b id="peerName"></b><div class="sub" id="presence">غير متصل</div><div class="sub" id="typing"></div></div><button id="block" class="round">⊘</button></div><div class="note">تُحفظ الرسائل على هذا الجهاز فقط — ليست متزامنة بين أجهزتك</div><div id="messages" class="messages"></div><div class="composer"><button id="attach" class="round">＋</button><input id="message" class="field" placeholder="اكتب رسالة..." maxlength="5000"><button id="send" class="round send">➤</button><input id="file" type="file" accept="image/*,video/*" class="hide"></div></section></main></div><div id="toast" class="toast hide"></div>
<script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x);let token=localStorage.getItem("luma_v2_token"),me=null,mode="login",tab="friends",friends=[],peer=null,socket=null,online=new Set(),typingTimer;
const req=(url,opt={})=>fetch(url,{...opt,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opt.headers||{})}}).then(async r=>{let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"تعذر تنفيذ الطلب");return d});
let opening=indexedDB.open("LumaChatV2",1);opening.onupgradeneeded=()=>{let d=opening.result;if(!d.objectStoreNames.contains("messages"))d.createObjectStore("messages",{keyPath:"id"})};
const local=()=>new Promise((r,j)=>{opening.onsuccess=()=>r(opening.result);opening.onerror=()=>j(opening.error)});
async function saveMsg(m){let d=await local();return new Promise(r=>{let t=d.transaction("messages","readwrite");t.objectStore("messages").put(m);t.oncomplete=r})}
async function allMsgs(){let d=await local();return new Promise(r=>{let q=d.transaction("messages").objectStore("messages").getAll();q.onsuccess=()=>r(q.result)})}
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hide");setTimeout(()=>$("toast").classList.add("hide"),2300)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("switch").onclick=()=>{mode=mode==="login"?"register":"login";$("authTitle").textContent=mode==="login"?"أهلاً بيك":"إنشاء حساب";$("authBtn").textContent=mode==="login"?"تسجيل الدخول":"إنشاء الحساب";$("switchLabel").textContent=mode==="login"?"ما عندك حساب؟":"عندك حساب؟";$("switch").textContent=mode==="login"?"إنشاء حساب":"تسجيل الدخول";};
$("authForm").onsubmit=async e=>{e.preventDefault();try{let d=await req("/api/"+mode,{method:"POST",body:JSON.stringify({username:$("username").value.trim(),password:$("password").value})});token=d.token;localStorage.setItem("luma_v2_token",token);await boot()}catch(x){$("authError").textContent=x.message}};
async function boot(){try{me=(await req("/api/me")).user;$("auth").classList.add("hide");$("app").classList.remove("hide");$("myName").textContent=me.username;$("myAvatar").textContent=me.username[0].toUpperCase();socket=io({auth:{token}});socket.on("presence",p=>{p.online?online.add(p.id):online.delete(p.id);if(peer?.id===p.id)$("presence").textContent=p.online?"متصل الآن":"غير متصل"});socket.on("private-message",async p=>{await saveMsg({id:p.id,peer:p.from,from:p.from,message:p.message,at:p.at});if(peer?.id===p.from){renderMessages();socket.emit("read",{to:p.from,ids:[p.id]})}else toast("وصلتك رسالة جديدة")});socket.on("message-sent",async p=>{let a=await allMsgs(),m=a.find(x=>x.id===p.id);if(m){m.at=p.at;await saveMsg(m);renderMessages()}});socket.on("typing",p=>{if(peer?.id===p.from){$("typing").textContent=p.typing?"يكتب الآن...":"";}});socket.on("read",p=>{if(peer?.id===p.from)toast("تمت قراءة رسالتك")});await loadFriends();renderList()}catch(e){localStorage.removeItem("luma_v2_token");token=null;$("auth").classList.remove("hide");$("app").classList.add("hide")}}
async function loadFriends(){friends=(await req("/api/friends")).friends}
function person(u,sub=""){let el=document.createElement("div");el.className="person";el.innerHTML='<div class="avatar">'+esc(u.username[0].toUpperCase())+'</div><div class="pinfo"><b>'+esc(u.username)+'</b><div class="sub">'+esc(sub|| (online.has(u.id)?"متصل الآن":"مستخدم") )+'</div></div>';return el}
async function renderList(){let box=$("list");box.innerHTML="";if(tab==="requests"){let d=await req("/api/requests");if(!d.incoming.length){box.innerHTML='<div class="empty">لا توجد طلبات واردة</div>';return}d.incoming.forEach(r=>{let el=person(r.user,"طلب تواصل");let b=document.createElement("button");b.className="primary";b.textContent="قبول";b.onclick=async()=>{await req("/api/requests/"+r.id+"/accept",{method:"POST"});await loadFriends();renderList();toast("تم قبول الطلب")};el.append(b);box.append(el)});return}
let q=$("search").value.trim();if(tab==="search"||q){let d=await req("/api/users?q="+encodeURIComponent(q));d.users.forEach(u=>{let el=person(u,"إرسال طلب صداقة");el.onclick=async()=>{try{await req("/api/requests/"+u.id,{method:"POST"});toast("تم إرسال الطلب")}catch(e){toast(e.message)}};box.append(el)});if(!d.users.length)box.innerHTML='<div class="empty">ما لقينا مستخدمين</div>';return}
friends.forEach(u=>{let el=person(u);el.onclick=()=>openPeer(u);box.append(el)});if(!friends.length)box.innerHTML='<div class="empty">ابحث عن مستخدم وارسله طلب صداقة</div>'}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;renderList()});$("search").oninput=()=>{if($("search").value.trim())tab="search";renderList()};
async function openPeer(u){peer=u;$("placeholder").classList.add("hide");$("panel").classList.remove("hide");$("app").classList.add("open");$("peerName").textContent=u.username;$("peerAvatar").textContent=u.username[0].toUpperCase();$("presence").textContent=online.has(u.id)?"متصل الآن":"غير متصل";await renderMessages()}
async function renderMessages(){if(!peer)return;let a=(await allMsgs()).filter(m=>m.peer===peer.id).sort((x,y)=>x.at-y.at),box=$("messages");box.innerHTML="";a.forEach(m=>{let el=document.createElement("div");el.className="msg"+(m.from===me.id?" mine":"");if(m.message.type==="text")el.textContent=m.message.text;else if(m.message.type==="image"){let i=document.createElement("img");i.src=m.message.data;el.append(i)}else{let v=document.createElement("video");v.src=m.message.data;v.controls=true;el.append(v)}let s=document.createElement("div");s.className="stamp";s.textContent=new Date(m.at||Date.now()).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"});el.append(s);box.append(el)});box.scrollTop=box.scrollHeight}
async function send(message){let id=crypto.randomUUID(),m={id,peer:peer.id,from:me.id,message,at:Date.now()};await saveMsg(m);socket.emit("private-message",{id,to:peer.id,message});await renderMessages()}
$("send").onclick=async()=>{let v=$("message").value.trim();if(v&&peer){$("message").value="";await send({type:"text",text:v})}};$("message").onkeydown=e=>{if(e.key==="Enter")$("send").click()};$("message").oninput=()=>{if(peer){socket.emit("typing",{to:peer.id,typing:true});clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit("typing",{to:peer.id,typing:false}),900)}};
$("attach").onclick=()=>$("file").click();$("file").onchange=async()=>{let f=$("file").files[0];if(!f)return;if(f.size>5*1024*1024){toast("الحد الأعلى 5MB");return}let type=f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":null;if(!type){toast("اختر صورة أو فيديو");return}let data=await new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});await send({type,data,name:f.name});$("file").value=""};
$("block").onclick=async()=>{if(peer&&confirm("حظر هذا المستخدم؟")){await req("/api/block/"+peer.id,{method:"POST"});friends=friends.filter(x=>x.id!==peer.id);peer=null;$("panel").classList.add("hide");$("placeholder").classList.remove("hide");$("app").classList.remove("open");renderList();toast("تم الحظر")}};
$("back").onclick=()=>$("app").classList.remove("open");$("logout").onclick=()=>{localStorage.removeItem("luma_v2_token");location.reload()};
$("theme").onclick=()=>{let d=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=d?"dark":"light";localStorage.setItem("luma_v2_theme",d?"dark":"light");$("theme").textContent=d?"☀":"☾"};if(localStorage.getItem("luma_v2_theme")==="dark"){$("theme").click()}
if(token)boot();
</script></body></html>
