<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>دردشة مشفرة</title>
</head>
<body>

<h2>🔐 دردشة مشفرة</h2>

<input id="key" placeholder="الرمز السري">
<br><br>

<input id="msg" placeholder="اكتب رسالة">
<button onclick="send()">إرسال</button>

<ul id="chat"></ul>

<script>
function encrypt(text, key) {
  return btoa(text.split('').map((c,i)=>
    String.fromCharCode(c.charCodeAt(0)^key.charCodeAt(i%key.length))
  ).join(''));
}

function decrypt(text, key) {
  text = atob(text);
  return text.split('').map((c,i)=>
    String.fromCharCode(c.charCodeAt(0)^key.charCodeAt(i%key.length))
  ).join('');
}

function send() {
  const key = document.getElementById("key").value;
  const msg = document.getElementById("msg").value;
  if(!key || !msg) return;

  const enc = encrypt(msg, key);
  localStorage.setItem("chat", enc);
  show(enc);
  document.getElementById("msg").value="";
}

function show(enc){
  const key = document.getElementById("key").value;
  const li = document.createElement("li");
  li.textContent = decrypt(enc, key);
  document.getElementById("chat").appendChild(li);
}

if(localStorage.getItem("chat")){
  show(localStorage.getItem("chat"));
}
</script>

</body>
</html>
